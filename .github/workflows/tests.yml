name: tests
on: push          #run when I push

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7                 # get the code
      - uses: astral-sh/setup-uv@v7               # install uv
      - run: uv sync                              # install packages
      - run: uv run pytest                        # run the tests